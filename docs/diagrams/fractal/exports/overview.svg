      <text x="915.64" y="56" font-size="14" font-weight="600" fill="#243b34"><tspan x="915.64" dy="0">Local project</tspan><tspan x="915.64" dy="20">services</tspan></text>
      <text x="915.64" y="101" font-size="12" font-weight="400" fill="#67746e"><tspan x="915.64" dy="0">Configured project</tspan><tspan x="915.64" dy="17">commands and independently</tspan><tspan x="915.64" dy="17">started TCP listeners can</tspan><tspan x="915.64" dy="17">coexist.</tspan></text>
