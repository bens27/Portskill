      <text x="915.64" y="330" font-size="14" font-weight="600" fill="#243b34"><tspan x="915.64" dy="0">Registry and local</tspan><tspan x="915.64" dy="20">files</tspan></text>
      <text x="915.64" y="375" font-size="12" font-weight="400" fill="#67746e"><tspan x="915.64" dy="0">Global registry.json is</tspan><tspan x="915.64" dy="17">authoritative; project</tspan><tspan x="915.64" dy="17">mirrors and lifecycle logs</tspan><tspan x="915.64" dy="17">are derived local files.</tspan><tspan x="915.64" dy="17">listen.json records the</tspan><tspan x="915.64" dy="17">UI/MCP endpoint.</tspan></text>
