<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Portskill / Allocation, observation, and control</title><desc id="description">Verify shutdown before changing allocation; TCP reachability alone does not establish process ownership.. Colored outlines mark exact authored boundary members, not inferred trust envelopes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Portskill / Allocation, observation, and control</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Verify shutdown before changing allocation; TCP reachability alone does not establish process ownership.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(577.056 210) scale(1.025)"><g data-element="commands"><rect x="21" y="20" width="705.55" height="653" rx="16" fill="none" stroke="#739886" stroke-width="2"/><rect x="25" y="24" width="697.55" height="645" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(696.55 41) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">Shared CLI operations</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M263,190.5 L279,190.5 L279,377 L465.51,377" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,190.5 L279,190.5 L279,563.5 L465.51,563.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,190.5 L465.51,190.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="allocation"><rect x="466.51" y="304" width="231.03999999999994" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.55 321) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="486.51" y="336" font-size="14" font-weight="600" fill="#292927"><tspan x="486.51" dy="0">Allocation and</tspan><tspan x="486.51" dy="20">persistence</tspan></text>
      <text x="486.51" y="381" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="486.51" dy="0">Locks the global registry;</tspan><tspan x="486.51" dy="17">reserves, reclaims, and</tspan><tspan x="486.51" dy="17">releases ranges. Writes</tspan><tspan x="486.51" dy="17">project mirrors.</tspan></text>
      </g><g data-element="lifecycle"><rect x="50" y="111" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 128) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="143" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Start and Stop</tspan></text>
      <text x="70" y="167" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Checks occupancy before</tspan><tspan x="70" dy="17">launch. Runs a configured</tspan><tspan x="70" dy="17">stop hook, terminates</tspan><tspan x="70" dy="17">tracked processes, then</tspan><tspan x="70" dy="17">verifies shutdown before</tspan><tspan x="70" dy="17">success.</tspan></text>
      </g><g data-element="observation"><rect x="466.51" y="482" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(652.51 499) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="486.51" y="514" font-size="14" font-weight="600" fill="#292927"><tspan x="486.51" dy="0">Listener</tspan><tspan x="486.51" dy="20">observation</tspan></text>
      <text x="486.51" y="559" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="486.51" dy="0">Probes every local TCP port</tspan><tspan x="486.51" dy="17">in a range. Reachability is</tspan><tspan x="486.51" dy="17">separate from allocation</tspan><tspan x="486.51" dy="17">and ownership; released plus</tspan><tspan x="486.51" dy="17">reachable means occupied.</tspan></text>
      </g><g data-element="sharing"><rect x="466.51" y="109" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(652.51 126) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="486.51" y="141" font-size="14" font-weight="600" fill="#292927"><tspan x="486.51" dy="0">Optional Tailnet</tspan><tspan x="486.51" dy="20">sharing</tspan></text>
      <text x="486.51" y="186" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="486.51" dy="0">Configures Serve or Funnel</tspan><tspan x="486.51" dy="17">mappings. Sharing does not</tspan><tspan x="486.51" dy="17">supply HTTP authentication</tspan><tspan x="486.51" dy="17">or remote process</tspan><tspan x="486.51" dy="17">management.</tspan></text>
      </g><g><rect x="315.62" y="383" width="97.26999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="364.255" y="396" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="364.255" dy="0">Commit verified</tspan><tspan x="364.255" dy="15">state</tspan></text></g><g><rect x="311.495" y="569.5" width="105.51999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="364.255" y="582.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="364.255" dy="0">Check occupancy</tspan><tspan x="364.255" dy="15">and shutdown</tspan></text></g><g><rect x="311" y="196.5" width="106.50999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="364.255" y="209.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="364.255" dy="0">Activate or tear</tspan><tspan x="364.255" dy="15">down mapping</tspan></text></g></g>
