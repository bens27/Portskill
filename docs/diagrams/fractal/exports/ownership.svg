      <g transform="translate(862.16 76) scale(0.667)" color="#647D72" opacity="0.85"><title>System</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m12 7 5 5-5 5-5-5Z"/></g></g>
      <text x="696.16" y="91" font-size="14" font-weight="600" fill="#292927"><tspan x="696.16" dy="0">Developers and</tspan><tspan x="696.16" dy="20">agents</tspan></text>
      <text x="696.16" y="136" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="696.16" dy="0">Use the dashboard, a</tspan><tspan x="696.16" dy="17">terminal, or an MCP client.</tspan></text>
      </g><g data-element="portskill"><rect x="432.1599999999999" y="309" width="212" height="108" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(618.16 326) scale(0.667)" color="#647D72" opacity="0.85"><title>System</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m12 7 5 5-5 5-5-5Z"/></g></g>
      <text x="452.16" y="341" font-size="14" font-weight="600" fill="#292927"><tspan x="452.16" dy="0">Portskill</tspan></text>
      <text x="452.16" y="365" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="452.16" dy="0">Reserves local ports and</tspan><tspan x="452.16" dy="17">coordinates service</tspan><tspan x="452.16" dy="17">lifecycles.</tspan></text>
      </g><g data-element="registry"><rect x="24" y="555" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(210 572) scale(0.667)" color="#647D72" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="44" y="587" font-size="14" font-weight="600" fill="#292927"><tspan x="44" dy="0">Registry and local</tspan><tspan x="44" dy="20">files</tspan></text>
      <text x="44" y="632" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="44" dy="0">Global registry.json is</tspan><tspan x="44" dy="17">authoritative; project</tspan><tspan x="44" dy="17">mirrors and lifecycle logs</tspan><tspan x="44" dy="17">are derived local files.</tspan><tspan x="44" dy="17">listen.json records the</tspan><tspan x="44" dy="17">UI/MCP endpoint.</tspan></text>
      </g><g data-element="tracked"><rect x="1055.1599999999999" y="725" width="220" height="171" rx="16" fill="none" stroke="#739886" stroke-width="2"/><rect x="1059.1599999999999" y="729" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1245.16 746) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1079.16" y="761" font-size="14" font-weight="600" fill="#292927"><tspan x="1079.16" dy="0">Tracked</tspan><tspan x="1079.16" dy="20">processes</tspan></text>
      <text x="1079.16" y="806" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1079.16" dy="0">Start records PID and</tspan><tspan x="1079.16" dy="17">process group. Stop can</tspan><tspan x="1079.16" dy="17">terminate tracked</tspan><tspan x="1079.16" dy="17">processes after the</tspan><tspan x="1079.16" dy="17">project hook.</tspan></text>
      </g><g data-element="untracked"><rect x="811.1599999999999" y="725" width="220" height="154" rx="16" fill="none" stroke="#b59b72" stroke-width="2"/><rect x="815.1599999999999" y="729" width="212" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1001.16 746) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="835.16" y="761" font-size="14" font-weight="600" fill="#292927"><tspan x="835.16" dy="0">Other TCP</tspan><tspan x="835.16" dy="20">listeners</tspan></text>
      <text x="835.16" y="806" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="835.16" dy="0">Observed for occupancy</tspan><tspan x="835.16" dy="17">only. Portskill does not kill</tspan><tspan x="835.16" dy="17">an untracked listener by</tspan><tspan x="835.16" dy="17">port or working directory.</tspan></text>
      </g><g data-element="hooks"><rect x="567.1599999999999" y="725" width="220" height="167" rx="16" fill="none" stroke="#739886" stroke-width="2"/><rect x="571.1599999999999" y="729" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(757.16 746) scale(0.667)" color="#647D72" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="591.16" y="761" font-size="14" font-weight="600" fill="#292927"><tspan x="591.16" dy="0">Project hooks</tspan></text>
      <text x="591.16" y="785" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="591.16" dy="0">Configured executable</tspan><tspan x="591.16" dy="17">start/stop scripts run with</tspan><tspan x="591.16" dy="17">the current user</tspan><tspan x="591.16" dy="17">permissions. Hooks can</tspan><tspan x="591.16" dy="17">perform project-defined</tspan><tspan x="591.16" dy="17">cleanup.</tspan></text>
      </g><g data-element="tailscale"><rect x="289.5799999999999" y="555" width="212" height="108" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(475.58 572) scale(0.667)" color="#647D72" opacity="0.85"><title>System</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m12 7 5 5-5 5-5-5Z"/></g></g>
      <text x="309.58" y="587" font-size="14" font-weight="600" fill="#292927"><tspan x="309.58" dy="0">Tailscale</tspan></text>
      <text x="309.58" y="611" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="309.58" dy="0">Optional external CLI and</tspan><tspan x="309.58" dy="17">daemon for Serve or Funnel</tspan><tspan x="309.58" dy="17">exposure.</tspan></text>
