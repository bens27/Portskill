      <g transform="translate(618.16 42) scale(0.667)" color="#647D72" opacity="0.85"><title>System</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m12 7 5 5-5 5-5-5Z"/></g></g>
      <text x="452.16" y="57" font-size="14" font-weight="600" fill="#292927"><tspan x="452.16" dy="0">Optional macOS</tspan><tspan x="452.16" dy="20">shell</tspan></text>
      <text x="452.16" y="102" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="452.16" dy="0">Native menu app starts</tspan><tspan x="452.16" dy="17">Python, or a launchd daemon</tspan><tspan x="452.16" dy="17">supervises Python in</tspan><tspan x="452.16" dy="17">external-server mode.</tspan></text>
