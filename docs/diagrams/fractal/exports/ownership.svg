<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Portskill / What Portskill can stop</title><desc id="description">Tracked processes and configured hooks carry control authority. Other listeners are observed only.. Colored outlines mark exact authored boundary members, not inferred trust envelopes.</desc>
