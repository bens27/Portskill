987" y="469" width="121.57999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="475.36999999999983" y="482" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="475.36999999999983" dy="0">Execute configured</tspan><tspan x="475.36999999999983" dy="15">hooks</tspan></text></g><g><rect x="685.2199999999998" y="469" width="80.99000000000001" height="38" rx="5" fill="#f8f8f6"/><text x="725.7149999999998" y="482" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="725.7149999999998" dy="0">Probe TCP</tspan><tspan x="725.7149999999998" dy="15">reachability</tspan></text></g><g><rect x="557.1599999999999" y="469" width="107.05999999999999" height="38" rx="5" fill="#f8f8f6"/><text x="610.6899999999998" y="482" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="610.6899999999998" dy="0">Probe TCP</tspan><tspan x="610.6899999999998" dy="15">reachability only</tspan></text></g><g><rect x="280.79999999999995" y="469" width="112.77999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="337.18999999999994" y="482" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="337.18999999999994" dy="0">Configure Serve /</tspan><tspan x="337.18999999999994" dy="15">Funnel</tspan></text></g><g><rect x="410.8399999999999" y="223" width="125.31999999999996" height="38" rx="5" fill="#f8f8f6"/><text x="473.4999999999999" y="236" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="473.4999999999999" dy="0">Launch or supervise</tspan><tspan x="473.4999999999999" dy="15">server</tspan></text></g></g>
