[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portskill"
version = "0.1.1"
description = "Portskill — local port registry for humans and LLMs (UI + MCP + CLI, stdlib-only runtime)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ben" }]
keywords = ["ports", "registry", "mcp", "devtools", "portskill"]
# Runtime is stdlib-only; no install_requires.
dependencies = []

[project.urls]
Homepage = "https://github.com/bens27/Portskill"
Repository = "https://github.com/bens27/Portskill"
Issues = "https://github.com/bens27/Portskill/issues"
Changelog = "https://github.com/bens27/Portskill/blob/main/CHANGELOG.md"

[project.scripts]
portskill = "portskill.server:main"
portskill-cli = "portskill.cli:main"

[tool.setuptools.packages.find]
include = ["portskill*"]

[tool.setuptools.package-data]
portskill = ["static/**/*"]
