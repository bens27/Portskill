name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run smoke and unit suite
        run: ./scripts/smoke_test.sh

  package:
    name: Source and wheel installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/portskill-venv"
          "$RUNNER_TEMP/portskill-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/portskill-venv/bin/python" tests/check_installed.py
      - name: Verify source distribution
        run: |
          mkdir "$RUNNER_TEMP/portskill-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/portskill-source" --strip-components=1
          cd "$RUNNER_TEMP/portskill-source"
          ./scripts/smoke_test.sh
